name: CI (frontend)

# Frontend/product CI (pack 01 doc 11). The canonical API/worker live in the
# separate Auctions-Backend repo and have their own CI — this pipeline no longer
# runs the frozen co-located backend e2e (see apps/api/DEPRECATED.md). It builds
# and tests @singha/web + shared frontend packages, and blocks dead nav links.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit + component tests (frontend packages)
        run: pnpm turbo run test --filter=@singha/web... --filter=@singha/auctionflow

      - name: Production build (web)
        run: pnpm turbo run build --filter=@singha/web

      - name: Internal route/link check (no dead primary nav)
        run: node scripts/check-routes.mjs
